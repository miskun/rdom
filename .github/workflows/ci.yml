name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the toolchain: rust-toolchain.toml.
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` covers libs, bins, integration tests, benches,
      # AND examples. Examples are TTY-bound `main`s and can't be
      # `cargo test`'d; the showcase demos behind `rdom-showcase`'s
      # examples are golden-compared by its paint snapshot tests, so
      # visible regressions to the UA chrome are caught there.
      - run: cargo build --workspace --all-targets --locked
      # `--no-fail-fast`: one crate's failing test binary must not hide
      # every other crate's results on that runner.
      - run: cargo test --workspace --locked --no-fail-fast

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the toolchain: rust-toolchain.toml.
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-targets` lints lib + bins + tests + examples + benches.
      # Examples therefore can't ship warnings either.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the toolchain: rust-toolchain.toml.
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links, links to private items, bare URLs: all
      # errors. `test-util` so `VirtualScreen` is documented, as on docs.rs.
      - run: cargo doc --workspace --no-deps --locked --features rdom-tui/test-util
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One source of truth for the toolchain: rust-toolchain.toml.
      - id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - run: cargo fmt --all --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The MSRV is the workspace's `rust-version`; the published crates
      # must build on it (the showcase and the tests use the pinned
      # toolchain's newer API freely).
      - id: msrv
        shell: bash
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked -p rdom-core -p rdom-style -p rdom-css -p rdom-parser -p rdom-tui
