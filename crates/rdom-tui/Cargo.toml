[package]
name = "rdom-tui"
# Diverges from the shared workspace version (0.3.4): rdom-tui changed across
# 0.3.5–0.3.14 (table column-sizing + layout/paint/border/cascade fixes +
# drag-autoscroll + its robustness/selection-precision follow-ups + the
# mid-tick cascade so a consumer's scroll-handler DOM mutations are realized +
# the position_at user-select:none empty-space snap gate). Needs rdom-core 0.3.5
# (the drag-autoscroll opt-in); rdom-style/css/parser are unchanged at 0.3.4.
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal rendering layer for rdom-core — flexbox layout, TUI styles, key/mouse events. Use rdom-core directly for headless DOM manipulation."
readme = "README.md"
keywords = ["tui", "dom", "terminal", "flexbox", "cascade"]
categories = ["command-line-interface", "gui"]

[features]
default = []
# Skip BSU/ESU synchronized output sequences (for terminals that don't
# handle DEC private mode 2026 gracefully). Default off = emit them;
# non-supporting terminals ignore.
no-synchronized-output = []
# Test utilities for downstream test suites: `VirtualScreen`, a headless
# VT emulator that replays emitted ANSI bytes into an inspectable grid.
# Not part of the default API; this crate's own unit tests get it via
# `cfg(test)`.
test-util = []

# docs.rs builds with `test-util` so `VirtualScreen` is documented; the
# README's Features section says it is test-only.
[package.metadata.docs.rs]
features = ["test-util"]

[dependencies]
rdom-core = { path = "../rdom-core", version = "0.4.0" }
rdom-css = { path = "../rdom-css", version = "0.4.0" }
rdom-style = { path = "../rdom-style", version = "0.4.0" }

# Terminal rendering primitives. Pure-Rust, ~30KB binary cost combined.
# - compact_str: inline-stored grapheme cluster in each Cell (up to 24B)
# - unicode-segmentation: TR29 grapheme cluster iteration
# - unicode-width: UAX #11 visible cell width — the foundation of all
#   positioning math in the renderer. See RDOM_RENDER.md §12.
compact_str = "0.9"
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

# Terminal I/O — raw mode, alt screen, cursor control, size detection.
# We emit SGR bytes ourselves (our own Color/Modifier, our own diff);
# crossterm handles the platform-specific mode switching.
crossterm = { workspace = true }

# Clipboard (copy / cut / paste) — cross-platform native clipboard.
# Runtime-optional: if initialization fails (no display server, WSL
# without clip.exe, sandboxed build, etc.) the `SystemClipboard` falls
# back to a no-op so apps keep running. Tests use `MemoryClipboard`.
arboard = { workspace = true }

# URL opening — used by the `<a href>` click default action to hand
# external URLs (http/https/mailto/…) to the OS. Tiny pure-Rust crate
# that wraps platform-specific `xdg-open` / `open` / `start`. Tests
# use `MemoryUrlOpener` to avoid shelling out.
open = { workspace = true }

[build-dependencies]
# Read `property_dispatch::property_names()` at build time to emit
# camelCase aliases (one method per shipped CSS property) onto
# `StyleDeclaration`. Same single source of truth the runtime uses
# — no parallel list to drift. See `build.rs`.
rdom-style = { path = "../rdom-style", version = "0.4.0" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["rayon"] }
# Used by the `parse_and_render` example (the three crates composing).
# Not a runtime dep of rdom-tui itself.
rdom-parser = { path = "../rdom-parser", version = "0.4.0" }
# The crate's own integration tests need `VirtualScreen` (`test-util`):
# a self dev-dependency turns the feature on for every test build of
# this package, so `cargo test -p rdom-tui` and `cargo test --workspace`
# run `tests/inline_flow.rs` without extra flags and without leaning on
# a consumer's dev-dependency. `cargo publish` strips path-only
# dev-dependencies, so a test run from the published tarball needs
# `--features test-util` for that one target (it is skipped otherwise).
rdom-tui = { path = ".", features = ["test-util"] }

# Uses `VirtualScreen`, so it needs `test-util` — enabled for every test
# build by the self dev-dependency above.
[[test]]
name = "inline_flow"
path = "tests/inline_flow.rs"
required-features = ["test-util"]

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "block_layout"
harness = false
