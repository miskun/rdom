[package]
name = "rdom-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless capture, inspection and design-iteration sessions for rdom-tui apps — deterministic frames as JSON, text and images, driven over a JSON-RPC session for agents and people."
readme = "README.md"
keywords = ["tui", "dom", "terminal", "headless", "inspector"]
categories = ["command-line-interface", "development-tools::testing"]

[dependencies]
rdom-tui = { path = "../rdom-tui", version = "0.6.5" }
# The session builds the input events `App::handle_event` takes.
crossterm = { workspace = true }
# The capture contract and the session protocol are JSON; serde is the
# boring, correct way to keep the Rust types the single source of both.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The text view splits a run back into cells: one grapheme cluster per
# cell, its width by UAX #11 — the same rules rdom-tui's cells use.
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

# `serve` keeps stdout for the protocol and points fd 1 at stderr, so app
# code that prints cannot corrupt it (safe `dup` / `dup2`; already in the
# tree through rdom-tui).
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", default-features = false, features = ["std", "stdio"] }

[dev-dependencies]
# The unit tests' fixture app is styled from CSS text.
rdom-css = { path = "../rdom-css", version = "0.6.0" }
