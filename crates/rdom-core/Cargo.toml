[package]
name = "rdom-core"
# Diverges from the shared workspace version (0.3.4): rdom-core gained additive
# public API (the pointer-capture drag-autoscroll opt-in) in 0.3.5 while
# rdom-style/css/parser were unchanged. They keep their `rdom-core = "0.3.4"`
# pins (caret-resolves 0.3.5) and don't republish; only rdom-core + rdom-tui do.
version = "0.3.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Arena-backed DOM for Rust — pure tree + events, no renderer. Can be used headlessly or paired with rdom-tui for terminal rendering."
readme = "README.md"
keywords = ["dom", "tree", "arena", "html"]
categories = ["data-structures", "parser-implementations"]

[features]
default = []

[dependencies]

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["rayon"] }

[[bench]]
name = "arena"
harness = false
