[package]
name = "rdom-css"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CSS string parser for rdom-tui — turns real CSS into Stylesheet / TuiStyle. Hand-rolled, no external parser deps."
readme = "README.md"
keywords = ["css", "parser", "rdom", "tui"]
categories = ["parser-implementations"]

[dependencies]
rdom-core = { path = "../rdom-core", version = "0.3.1" }
rdom-style = { path = "../rdom-style", version = "0.3.1" }

[dev-dependencies]
# Examples build a TuiDom + render it; rdom-tui is example-only,
# the parser core has no runtime/backend deps. Path-ONLY (no version)
# on purpose: rdom-tui depends on rdom-css, so a versioned dev-dep here
# would be an unpublishable cycle (cargo resolves dev-deps against the
# registry at publish time). cargo drops path-only dev-deps from the
# published manifest — they're example-only, consumers never need them
# — which breaks the cycle. Local example builds still resolve by path.
rdom-parser = { path = "../rdom-parser" }
rdom-tui = { path = "../rdom-tui" }
