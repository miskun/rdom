# Pinned, not floating: a new stable can add lints that break
# `clippy -D warnings` on every PR. CI reads this file (see
# .github/workflows/ci.yml) so local and CI always agree. Bump
# deliberately, in its own commit, and run the full gate.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
